services:
  db:
    image: postgres:15-alpine
    container_name: hdms-db
    environment:
      POSTGRES_DB: hdms
      POSTGRES_USER: hdms
      POSTGRES_PASSWORD: hdms123
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hdms -d hdms"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: hdms-backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/hdms
      DB_USER: hdms
      DB_PASS: hdms123
      JWT_SECRET: hdms-secret-key-please-change-in-production-0123456789abcdef
      SEED_DEMO_DATA: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: hdms-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
