services:
  db:
    image: postgres:16-alpine
    container_name: hd-center-db
    environment:
      POSTGRES_DB: hd_center
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hd_center"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    networks:
      - hd-net

  backend:
    build: ./backend
    container_name: hd-center-backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/hd_center
      DB_USER: postgres
      DB_PASS: postgres
      TZ: Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - hd-net

  frontend:
    build: ./frontend
    container_name: hd-center-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - hd-net

volumes:
  pgdata:

networks:
  hd-net:
    driver: bridge
