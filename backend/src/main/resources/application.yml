server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: hd-center-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hd_center}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

app:
  jwt-secret: ${JWT_SECRET:aGRjZW50ZXItand0LXNlY3JldC1rZXktMjAyNi1oZW1vZGlhbHlzaXMtcGxhdGZvcm0=}
  jwt-expire-minutes: ${JWT_EXPIRE_MINUTES:720}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: info
